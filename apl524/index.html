<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APL 524 – Practice Quiz</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--good:#22c55e;--bad:#ef4444;--border:#334155}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:780px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:1.6rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:#0b1222;color:var(--text);padding:12px 14px;text-align:left;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{cursor:default}
  .order-btn{text-align:center;padding:18px}
  .order-btn b{display:block;font-size:1.15rem}
  .order-btn small{color:var(--muted)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--muted);font-size:.9rem}
  .bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .q{font-size:1.1rem;margin:0 0 16px}
  .q pre{background:#0b1222;border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;font-size:.85rem;line-height:1.35}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt .l{display:inline-block;min-width:26px;font-weight:700;color:var(--accent)}
  .opt.correct{border-color:var(--good);background:rgba(34,197,94,.15)}
  .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.15)}
  .fb{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
  .fb.good{display:block;background:rgba(34,197,94,.12);border:1px solid var(--good)}
  .fb.bad{display:block;background:rgba(239,68,68,.12);border:1px solid var(--bad)}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .primary{background:var(--accent);color:#0f172a;border:none;font-weight:700;text-align:center}
  .link{background:none;border:none;color:var(--muted);padding:6px 0;text-decoration:underline}
  .missed{margin-top:18px}
  .missed div{border-top:1px solid var(--border);padding:10px 0;font-size:.92rem}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>APL 524 – Practice Quiz</h1>
  <p class="sub" id="subtitle"></p>

  <!-- MENU -->
  <div id="menu" class="card">
    <p style="margin-top:0">Pick a question order. Each order is a fixed shuffle, so you can come back to the same one.</p>
    <div class="grid" id="orders"></div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hidden">
    <div class="top">
      <span id="progress"></span>
      <span id="score"></span>
      <button class="link" onclick="showMenu()">← Menu</button>
    </div>
    <div class="bar"><div id="barfill"></div></div>
    <div class="q" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="actions"><button class="primary hidden" id="nextBtn" onclick="next()">Next →</button></div>
  </div>

  <!-- RESULTS -->
  <div id="results" class="card hidden">
    <h2 style="margin-top:0">Done!</h2>
    <p id="final"></p>
    <div class="actions">
      <button class="primary" onclick="restart()">Retry this order</button>
      <button onclick="showMenu()">Back to menu</button>
    </div>
    <div class="missed" id="missed"></div>
  </div>
</div>

<script>
/* ===================== QUESTION BANK ===================== */
const Q = [];
const L = "abcdefghij";
function tf(q, ans, e){ Q.push({q, o:["True","False"], a: ans ? 0 : 1, e}); }

const BIND4 = ["Language design time","Compile time","Load time","Run time"];
const BIND5 = [...BIND4, "None of the above"];

const ASM_ADD = `<pre>;call the sub
      mov  ax, 5                ;1
      push ax                   ;2
      mov  ax, 7                ;3

add   proc                      ;7
      push bp                   ;8

      add  ax, bx               ;12
      pop  bp                   ;13
      ret  4                    ;14
add   endp                      ;15</pre>`;

const PROCP = `<pre>procp proc
      push bp              ;save stack frame
      mov  bp, sp          ;create stack frame
      sub  sp, 4           ;create 2 local variables
      mov  word ptr [bp-2], -1
      mov  sp, bp
      pop  bp
      ret                  ;no parameters
procp endp</pre>`;

   int d;

2        GOTO 50

      GOTO 100

60    CONTINUE
100   CONTINUE</pre>`;

const FIB = `<pre>      PROGRAM FIBONA          -1
      INTEGER S, F(40)        -2
                              -3
      F(1) = 1                -4
      F(2) = 1                -5

         F(S) = F(S-1) + F(S-2) -7
11    CONTINUE                -8

10    FORMAT (1X, 5I12)       -10

const FUNC1 = `<pre>int func1(int *a){
   *a += 5;
   return 2 * (*a);
}</pre>Assume <code>int i = 10;</code> in the caller and <code>int sum = func1(&amp;i) + (i/2);</code>`;

   *k += 4;
   return 3 * (*k) - 1;
}</pre>Assume <code>int i = 10;</code> in the caller and <code>int sum = fun(&amp;i) + (i/2);</code>`;

const MASM_DECL = `<pre>Var1  DB  14
Var2  DW  54</pre>Assume AX = 11 and BX = 50.<br>`;

const CTRL = ["compound statement","control statement","control structure","do-while","goto","multiple selection","selection statement","switch","two-way selector","while"];
const GRAM = ["the lexemes and tokens of the rules","the abstractions in a BNF description","a BNF description or collection of rules","each successive sentential form in the sequence is a ___ of the previous sentential form","the meaning of a programming language's syntax","the form of a programming language's expressions, statements, and program units","the process of tracing or constructing a parse tree for a given input","the hierarchical syntactic structure of the sentences that define a language","in its final form it contains no nonterminals and is the generated sentence; intermediate forms are each of the strings in a derivation","a language used to describe another language"];

/* ---- Main question set ---- */
tf("COBOL is the only major compiled language that uses keywords rather than reserved words.", false, "It's Fortran.");

mc("Using this code:" + CFUNC_X + "Given what we know about runtime stacks, which statement is FALSE?", ["d is on the stack when x executes if(a+b ...)","b is on the stack when x executes if(a+b ...)","c is on the stack when x executes if(a+b ...)","All the statements are false","None of the statements are false (all true)"], "c", "c is a block variable, created only when its block is entered.");
mc("The only major compiled language that uses keywords rather than reserved words is:", ["COBOL","Ada","Java","C++","None of the above"], "e", "It's Fortran.");

mc("Java does not support which scope?", ["Global scope","Class scope","Method scope","Block scope","Package scope"], "a");
mc("BNF means:", ["Binary Neutral Format","Big Number Form","Biggies-Fermat Form","Backus-Naur Form","None of the above"], "d");

mc("Which is a means of representing signed integers in a programming language?", ["Sign magnitude","One's complement","Two's complement","All of the above","Only a and b","Only b and c"], "d");
mc("In programming languages from the 1980s and after, a primary influence on language design is:", ["The native architecture of some computer's hardware","Direct applicability to some application domain","Data abstraction","Object-oriented programming","All of the above"], "d");
tf("+, *, ( and ) are terminal symbols in the grammar above (the &lt;expr&gt; grammar).", true);
mc("Which language supports nesting of subroutines?", ["C++","Java","Ada","C#"], "c");
mc("Which language still supports implicit declaration?", ["C++","COBOL","FORTRAN","Java"], "c");
tf("The COBOLs, FORTRANs and Cs of the world are imperative languages.", true);
mc("In the Java statement <code>double p = 1.5;</code> the value of p is bound at:", BIND5, "d");
mc("The type double was bound to p at:", BIND4, "b");
mc("The binding of the word double to a 64-bit floating point number type was done at:", BIND4, "a");
mc("Stack-dynamic lifetime local variables are bound to memory cells ____ execution and remain bound until ____.", ["Before, the declaring subroutine exits","Before, the program exits","During, the declaring subroutine exits","During, the program exits"], "c");
mc("The lifetime of a variable is:", ["The time it is bound to a memory cell","The span of program statements in which the variable is visible"], "a");
mc("The scope of a variable is:", ["The time it is bound to a memory cell","The span of program statements in which the variable is visible"], "b");
tf("Keywords differ from reserved words in that keywords can be used in a context which may be different from their intended meaning in the language.", true);
tf("In a BNF grammar, terminals are symbols in a rule that are already reduced and non-terminals are symbols that need to be reduced, i.e. replaced.", true);
mc("A static lifetime variable:", ["Is bound to storage before the program starts executing","Is bound to storage as its declaration statement is elaborated","Requires indirect addressing (like with BP)","Both a and c","Both b and c"], "a");

tf("In Pascal, array subscripts can be any ordinal type, including integer, character and Boolean.", true);

mc("An implicit type conversion (e.g. int to float) that occurs in an assignment, expression or parameter is called:", ["Crossover","Coercion","Type cast","Corruption"], "b");

tf("In C, a for loop's start, stop and step values may all be omitted.", true);
tf("In C, pointer variables are implicitly dereferenced when passed as parameters.", false);

mc("Precedence and associativity rules can be overridden with:", ["Compiler directives","Operator overloading","Parentheses","Expression rearranging","Wishful thinking"], "c");

/* ===================== QUIZ ENGINE ===================== */
const NUM_ORDERS = 6;
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function orderFor(n){ const idx = Q.map((_, i) => i); const r = rng(n * 9973 + 17); for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }

let state = null;
const $ = id => document.getElementById(id);
const key = n => "apl524_order_" + n;
function save(){ localStorage.setItem(key(state.n), JSON.stringify({pos: state.pos, score: state.score, missed: state.missed})); }

function showMenu(){
  $("quiz").classList.add("hidden"); $("results").classList.add("hidden"); $("menu").classList.remove("hidden");
  const box = $("orders"); box.innerHTML = "";
  for (let n = 1; n <= NUM_ORDERS; n++){
    const s = JSON.parse(localStorage.getItem(key(n)) || "null");
    const b = document.createElement("button"); b.className = "order-btn";
    const status = s && s.pos > 0 ? (s.pos >= Q.length ? "Completed – " + s.score + "/" + Q.length : "Resume at Q" + (s.pos + 1)) : "Not started";
    b.innerHTML = "<b>Order " + n + "</b><small>" + status + "</small>";
    b.onclick = () => start(n);
    box.appendChild(b);
  }
}

function start(n){
  const s = JSON.parse(localStorage.getItem(key(n)) || "null");
  state = {n, order: orderFor(n), pos: 0, score: 0, missed: []};
  if (s && s.pos < Q.length){ Object.assign(state, s); }
  $("menu").classList.add("hidden"); $("results").classList.add("hidden"); $("quiz").classList.remove("hidden");
  render();
}

function restart(){ localStorage.removeItem(key(state.n)); start(state.n); }

function render(){
  if (state.pos >= Q.length) return finish();
  const q = Q[state.order[state.pos]];
  $("progress").textContent = "Order " + state.n + " · Question " + (state.pos + 1) + " / " + Q.length;
  $("score").textContent = "Score: " + state.score;
  $("barfill").style.width = (state.pos / Q.length * 100) + "%";
  $("qtext").innerHTML = q.q;
  $("fb").className = "fb"; $("fb").innerHTML = "";
  $("nextBtn").classList.add("hidden");
  const box = $("opts"); box.innerHTML = "";
  q.o.forEach((text, i) => {
    const b = document.createElement("button"); b.className = "opt";
    const l = document.createElement("span"); l.className = "l"; l.textContent = L[i] + ".";
    b.appendChild(l); b.appendChild(document.createTextNode(" " + text));
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  window.scrollTo({top: 0, behavior: "smooth"});
}

function answer(i){
  const q = Q[state.order[state.pos]];
  const btns = [...$("opts").children];
  btns.forEach(b => b.disabled = true);
  const fb = $("fb");
  if (i === q.a){
    btns[i].classList.add("correct");
    state.score++;
    fb.className = "fb good"; fb.innerHTML = "✅ Correct!" + (q.e ? " <span style='color:var(--muted)'>" + q.e + "</span>" : "");
    state.pos++; save();
    setTimeout(render, q.e ? 1400 : 700);
  } else {
    btns[i].classList.add("wrong"); btns[q.a].classList.add("correct");
    fb.className = "fb bad";
    fb.innerHTML = "❌ Not quite. Correct answer: <b>" + L[q.a] + ". " + escapeHTML(q.o[q.a]) + "</b>" + (q.e ? "<br><span style='color:var(--muted)'>" + q.e + "</span>" : "");
    state.missed.push(state.order[state.pos]);
    state.pos++; save();
    $("nextBtn").classList.remove("hidden");
  }
}

function next(){ render(); }
function escapeHTML(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function finish(){
  $("quiz").classList.add("hidden"); $("results").classList.remove("hidden");
  const pct = Math.round(state.score / Q.length * 100);
  $("final").textContent = "Order " + state.n + ": you scored " + state.score + " / " + Q.length + " (" + pct + "%).";
  const m = $("missed");
  m.innerHTML = state.missed.length ? "<h3>Questions you missed</h3>" : "<p>Perfect run! 🎉</p>";
  state.missed.forEach(qi => {
    const q = Q[qi]; const d = document.createElement("div");
    d.innerHTML = q.q + "<br><b style='color:var(--good)'>Answer: " + L[q.a] + ". " + escapeHTML(q.o[q.a]) + "</b>";
    m.appendChild(d);
  });
}

$("subtitle").textContent = Q.length + " questions · 6 random orders · progress is saved in your browser";
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (e.key === "Enter" && !$("nextBtn").classList.contains("hidden")) return next();
  const i = L.indexOf(e.key.toLowerCase());
  const btns = [...$("opts").children];
  if (i >= 0 && i < btns.length && !btns[i].disabled) answer(i);
});
showMenu();
</script>
